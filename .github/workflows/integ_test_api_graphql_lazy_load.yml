name: Integration Tests | API - GraphQL Lazy Load
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  api-lazy-load-tests:
    name: API Integration Tests | GraphQL Lazy Load
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSAPIPluginLazyLoadTests", "tvOS": "AWSAPIPluginLazyLoadTests", "watchOS": "AWSAPIPluginLazyLoadTests"}'
      project_path: ./AmplifyPlugins/API/Tests/APIHostApp
      resource_subfolder: api
    secrets: inherit
