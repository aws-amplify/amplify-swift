name: Integration Tests | API - REST User Pool
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  api-rest-user-pool-tests:
    name: API Integration Tests | REST User Pool
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSAPIPluginRESTUserPoolTests", "tvOS": "AWSAPIPluginRESTUserPoolTests", "watchOS": "AWSAPIPluginRESTUserPoolTestsWatch"}'
      project_path: ./AmplifyPlugins/API/Tests/APIHostApp
      resource_subfolder: api
    secrets: inherit
