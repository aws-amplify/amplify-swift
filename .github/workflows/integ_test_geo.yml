name: Integration Tests | Geo
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  geo-integration-tests:
    name: Geo Integration Tests
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSLocationGeoPluginIntegrationTests", "tvOS": "AWSLocationGeoPluginIntegrationTests", "watchOS": "AWSLocationGeoPluginIntegrationTestsWatch"}'
      project_path: ./AmplifyPlugins/Geo/Tests/GeoHostApp/
      resource_subfolder: geo
    secrets: inherit
