name: Build | Amplify Swift
on:
  workflow_call:
    inputs:
      identifier:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      macos:
        description: '💻 macOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
      visionos:
        description: 'ᯅ visionOS'
        required: true
        default: true
        type: boolean 
                
  push:
    branches-ignore:
      - main
      - release

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ inputs.identifier || github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main'}}

jobs:
  detect:
    name: Detect affected targets
    # Runs on ubuntu (abundant pool) rather than macOS (the scarce, shared Actions
    # pool this gating effort conserves). Needs only git, jq, python3, and
    # `swift package dump-package`; the official swift image supplies Swift on Linux
    # with no third-party action, and the manifest has no host-OS conditionals so the
    # dumped dependency graph matches macOS.
    runs-on: ubuntu-latest
    container: swift:6.0
    outputs:
      build: ${{ steps.sel.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq and python3
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq python3
          # The checkout dir is owned by a different UID than the container's root user, so git in
          # the detect script below aborts with "detected dubious ownership" unless we allow it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: sel
        shell: bash
        env:
          IDENTIFIER: ${{ inputs.identifier }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Build the whole package unless the change is confined to non-source paths. Deploy
          # (workflow_call, passes identifier) and manual dispatch always build.
          if [ -n "$IDENTIFIER" ] || [ "$EVENT_NAME" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_REF"
          git fetch --no-tags origin "$base" || true
          git diff --name-only "$(git merge-base HEAD "origin/$base")" HEAD > /tmp/changed.txt
          swift package dump-package > /tmp/package.json
          sel=$(python3 scripts/python/affected_targets.py \
            --package /tmp/package.json --changed /tmp/changed.txt \
            --groups scripts/python/unit_test_groups.json | grep '^selected=' | cut -d= -f2-)
          [ "$sel" = "[]" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"

  build-amplify-swift:
    name: Build Amplify Swift for ${{ matrix.platform }}
    needs: detect
    if: ${{ needs.detect.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS, tvOS, watchOS, visionOS]
        exclude:
          - platform: ${{ github.event.inputs.ios == 'false' && 'iOS' || 'None' }}
          - platform: ${{ github.event.inputs.macos == 'false' && 'macOS' || 'None' }}
          - platform: ${{ github.event.inputs.tvos == 'false' && 'tvOS' || 'None' }}
          - platform: ${{ github.event.inputs.watchos == 'false' && 'watchOS' || 'None' }}
          - platform: ${{ github.event.inputs.visionos == 'false' && 'visionOS' || 'None' }}
    uses: ./.github/workflows/build_scheme.yml
    with:
      scheme: Amplify-Package
      platform: ${{ matrix.platform }}

  confirm-pass:
    runs-on: ubuntu-latest
    name: Confirm Passing Build Steps
    if: ${{ !cancelled() }}
    needs: [ detect, build-amplify-swift ]
    env:
      EXIT_CODE: ${{ contains(needs.*.result, 'failure') && 1 || 0 }}
    steps:
      - run: exit $EXIT_CODE
