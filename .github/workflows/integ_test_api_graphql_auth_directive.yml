name: Integration Tests | API - GraphQL Auth Directive
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  api-graphql-auth-directive-tests:
    name: API Integration Tests | GraphQL Auth Directive
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSAPIPluginGraphQLAuthDirectiveTests", "tvOS": "AWSAPIPluginGraphQLAuthDirectiveTests", "watchOS": "AWSAPIPluginGraphQLAuthDirectiveTestsWatch"}'
      project_path: ./AmplifyPlugins/API/Tests/APIHostApp
      resource_subfolder: api
    secrets: inherit
