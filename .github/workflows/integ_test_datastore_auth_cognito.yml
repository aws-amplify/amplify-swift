name: Integration Tests | DataStore - Auth Cognito
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  datastore-integration-auth-cognito-tests:
    name: DataStore Integration Tests | Auth Cognito
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSDataStorePluginAuthCognitoTests", "tvOS": "AWSDataStorePluginAuthCognitoTests", "watchOS": "AWSDataStorePluginAuthCognitoTestsWatch"}'
      project_path: ./AmplifyPlugins/DataStore/Tests/DataStoreHostApp
      resource_subfolder: datastore
    secrets: inherit
