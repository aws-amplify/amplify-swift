name: Integration Tests | Auth
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
      hostedui-ios:
        description: '🌵 HostedUI iOS'
        required: true
        default: true
        type: boolean
      webauthn-ios:
        description: '🔐 WebAuthn iOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  auth-integration-tests:
    name: Auth Integration Tests
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
        exclude:
          - platform: ${{ github.event.inputs.ios == 'false' && 'iOS' || 'None' }}
          - platform: ${{ github.event.inputs.tvos == 'false' && 'tvOS' || 'None' }}
          - platform: ${{ github.event.inputs.watchos == 'false' && 'watchOS' || 'None' }}
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      scheme: ${{ matrix.platform == 'watchOS' && 'AuthIntegrationTestsWatch' || 'AuthIntegrationTests' }}
      platform: ${{ matrix.platform }}
      project_path: ./AmplifyPlugins/Auth/Tests/AuthHostApp/
      resource_subfolder: auth
      timeout-minutes: 60
    secrets: inherit

  auth-ui-integration-test-iOS:
    if: ${{ inputs.hostedui-ios != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # Each Hosted UI test must get its own simulator. iOS 26 does not present a
        # second ASWebAuthenticationSession in the same simulator session: the first
        # web sign-in works and every later one silently never presents, so the
        # tests hang instead of failing. Running one test per runner keeps both
        # tests enabled and gives each a clean simulator.
        include:
          - name: SignIn
            test: AuthHostedUIAppUITests/HostedUISignInTests/testSignInSuccess
          - name: SignInWithoutPresentationAnchor
            test: AuthHostedUIAppUITests/HostedUISignInTests/testSignInWithoutPresentationAnchorSuccess
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      scheme: AuthHostedUIApp
      platform: iOS
      project_path: ./AmplifyPlugins/Auth/Tests/AuthHostedUIApp/
      resource_subfolder: auth
      timeout-minutes: 60
      xcode_version: 'latest'
      only_testing: ${{ matrix.test }}
      job_name_suffix: ' | ${{ matrix.name }}'
    secrets: inherit

  auth-webauthn-integration-test-iOS:
    if: ${{ inputs.webauthn-ios != 'false' }}
    name: Auth WebAuthn Integration Tests (iOS)
    uses: ./.github/workflows/integ_test_auth_webauthn.yml
    with:
      xcode_version: 'latest'
    secrets: inherit
