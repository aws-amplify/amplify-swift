name: Integration Tests | Auth
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
      hostedui-ios:
        description: '🌵 HostedUI iOS'
        required: true
        default: true
        type: boolean
      webauthn-ios:
        description: '🔐 WebAuthn iOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  auth-integration-tests:
    name: Auth Integration Tests
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AuthIntegrationTests", "tvOS": "AuthIntegrationTests", "watchOS": "AuthIntegrationTestsWatch"}'
      project_path: ./AmplifyPlugins/Auth/Tests/AuthHostApp/
      resource_subfolder: auth
    secrets: inherit

  auth-ui-integration-test-iOS:
    if: ${{ inputs.hostedui-ios != 'false' }}
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AuthHostedUIApp"}'
      project_path: ./AmplifyPlugins/Auth/Tests/AuthHostedUIApp/
      resource_subfolder: auth
      xcode_version: 'latest'
    secrets: inherit

  auth-webauthn-integration-test-iOS:
    if: ${{ inputs.webauthn-ios != 'false' }}
    name: Auth WebAuthn Integration Tests (iOS)
    uses: ./.github/workflows/integ_test_auth_webauthn.yml
    with:
      xcode_version: 'latest'
    secrets: inherit
