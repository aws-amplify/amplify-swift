name: Integration Tests | DataStore - All
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
    id-token: write
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main'}}

jobs:
  detect:
    name: Detect whether DataStore is affected
    # Runs on ubuntu (abundant pool) rather than macOS (the scarce, shared Actions
    # pool this gating effort conserves). Needs only git, jq, python3, and
    # `swift package dump-package`; the official swift image supplies Swift on Linux
    # with no third-party action, and the manifest has no host-OS conditionals so the
    # dumped dependency graph matches macOS.
    runs-on: ubuntu-latest
    container: swift:6.0
    permissions:
      contents: read
    outputs:
      datastore: ${{ steps.sel.outputs.datastore }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq python3
          # The checkout dir is owned by a different UID than the container's root user, so git in
          # the detect script below aborts with "detected dubious ownership" unless we allow it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: sel
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Only gate on pull requests. Pushes to main (post-merge) and manual dispatch run all.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "datastore=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_REF"
          git fetch --no-tags origin "$base" || true
          git diff --name-only "$(git merge-base HEAD "origin/$base")" HEAD > /tmp/changed.txt
          swift package dump-package > /tmp/package.json
          python3 scripts/python/affected_targets.py \
            --package /tmp/package.json --changed /tmp/changed.txt \
            --groups scripts/python/integ_test_groups.json | tee -a "$GITHUB_OUTPUT"

  datastore-base-test:
    name: Base Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_base.yml
    secrets: inherit

  datastore-auth-iam-test:
    name: Auth IAM Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_auth_iam.yml
    secrets: inherit

  datastore-cpk-test:
    name: CPK Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_cpk.yml
    secrets: inherit

  datastore-lazy-load-test:
    name: Lazy Load Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_lazy_load.yml
    secrets: inherit

  datastore-multi-auth-test:
    name: Multi Auth Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_multi_auth.yml
    secrets: inherit

  datastore-transformer-v2-test:
    name: Transformer V2 Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_v2.yml
    secrets: inherit

  datastore-auth-cognito-test:
    name: Auth Cognito Tests
    needs: detect
    if: ${{ needs.detect.outputs.datastore == 'true' }}
    uses: ./.github/workflows/integ_test_datastore_auth_cognito.yml
    secrets: inherit

  integ-pass-confirmation:
    name: Confirm Passing DataStore Integration Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - detect
      - datastore-base-test
      - datastore-auth-iam-test
      - datastore-cpk-test
      - datastore-lazy-load-test
      - datastore-multi-auth-test
      - datastore-transformer-v2-test
      - datastore-auth-cognito-test
    env:
      EXIT_CODE: ${{ contains(needs.*.result, 'failure') && 1 || 0 }}
    steps:
      - run: exit $EXIT_CODE
