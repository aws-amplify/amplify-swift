name: Amplify Nightly Unit Test
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'

permissions:
    contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # One runner per platform, each running every scheme (built once). Mirrors the PR unit-test flow.
  unit_tests:
    name: ${{ matrix.platform }} Nightly Unit Tests
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS, tvOS, watchOS, visionOS]
    uses: ./.github/workflows/run_platform_all_schemes.yml
    with:
      platform: ${{ matrix.platform }}
      schemes: >-
        ["Amplify", "AWSPluginsCore", "AWSAPIPlugin", "AWSCloudWatchLoggingPlugin",
         "AWSCognitoAuthPlugin", "AWSDataStorePlugin", "AWSLocationGeoPlugin", "AWSPredictionsPlugin",
         "AWSPinpointAnalyticsPlugin", "AWSPinpointPushNotificationsPlugin", "AWSS3StoragePlugin",
         "CoreMLPredictionsPlugin", "InternalAWSPinpointUnitTests"]
      generate_coverage_report: false
      retry_tests: false