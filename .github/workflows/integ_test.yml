name: Integration Tests (Except DataStore & API)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
    id-token: write
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main'}}

jobs:
  detect:
    name: Detect affected targets
    # Runs on ubuntu (abundant pool) rather than macOS (the scarce, shared Actions pool this
    # gating effort conserves). Needs only git, jq, python3, and `swift package dump-package`;
    # the official swift image supplies Swift on Linux with no third-party action, and the
    # manifest has no host-OS conditionals so the dumped dependency graph matches macOS.
    runs-on: ubuntu-latest
    container: swift:6.0
    permissions:
      contents: read
    outputs:
      analytics: ${{ steps.sel.outputs.analytics }}
      kinesis_firehose: ${{ steps.sel.outputs.kinesis_firehose }}
      push_notifications: ${{ steps.sel.outputs.push_notifications }}
      predictions: ${{ steps.sel.outputs.predictions }}
      auth: ${{ steps.sel.outputs.auth }}
      auth_client: ${{ steps.sel.outputs.auth_client }}
      auth_client_interop: ${{ steps.sel.outputs.auth_client_interop }}
      geo: ${{ steps.sel.outputs.geo }}
      storage: ${{ steps.sel.outputs.storage }}
      logging: ${{ steps.sel.outputs.logging }}
      cloudwatch: ${{ steps.sel.outputs.cloudwatch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq and python3
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq python3
          # The checkout dir is owned by a different UID than the container's root user, so git
          # in the detect script aborts with "detected dubious ownership" unless we allow it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: sel
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Only gate on pull requests. Pushes to main (post-merge) and manual dispatch run all.
          categories=($(jq -r 'keys[]' scripts/python/integ_test_groups.json))
          if [ "$EVENT_NAME" != "pull_request" ]; then
            for c in "${categories[@]}"; do
              echo "$c=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # A file an Xcode project copies into a bundle (a host app's README, say) that is missing from the
          # checkout breaks the copying target's build, which a skipped job can't show: fail here, naming the project.
          python3 scripts/python/affected_targets.py --check-bundled
          base="$BASE_REF"
          git fetch --no-tags origin "$base" || true
          # With rename detection a rename lists only its new path. --renames gets each rename's old and new paths;
          # the selector attributes the old path too, and fails closed on an unknown one unless the new one is attributed.
          mb="$(git merge-base HEAD "origin/$base")"
          git diff --name-only -M "$mb" HEAD > /tmp/changed.txt
          git diff --name-status -M --diff-filter=R "$mb" HEAD | cut -f2- > /tmp/renames.txt
          swift package dump-package > /tmp/package.json
          python3 scripts/python/affected_targets.py \
            --package /tmp/package.json --changed /tmp/changed.txt --renames /tmp/renames.txt \
            --groups scripts/python/integ_test_groups.json | tee -a "$GITHUB_OUTPUT"

  analytics-test:
    name: Analytics Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.analytics == 'true' }}
    uses: ./.github/workflows/integ_test_analytics.yml
    secrets: inherit

  kinesis-firehose-test:
    name: Kinesis & Firehose Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.kinesis_firehose == 'true' }}
    uses: ./.github/workflows/integ_test_kinesis_firehose.yml
    secrets: inherit

  push-notifications-test:
    name: Push Notifications Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.push_notifications == 'true' }}
    uses: ./.github/workflows/integ_test_push_notifications.yml
    secrets: inherit

  predictions-test:
    name: Predictions Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.predictions == 'true' }}
    uses: ./.github/workflows/integ_test_predictions.yml
    secrets: inherit

  auth-test:
    name: Auth Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.auth == 'true' }}
    uses: ./.github/workflows/integ_test_auth.yml
    secrets: inherit

  auth-client-test:
    name: Auth Cognito Client Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.auth_client == 'true' || needs.detect.outputs.auth_client_interop == 'true' }}
    uses: ./.github/workflows/integ_test_auth_client.yml
    with:
      # auth_client_interop alone (a plugin-only change) runs only the plugin interop job.
      skip-client-suites: ${{ needs.detect.outputs.auth_client != 'true' }}
    secrets: inherit

  geo-test:
    name: Geo Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.geo == 'true' }}
    uses: ./.github/workflows/integ_test_geo.yml
    secrets: inherit

  storage-test:
    name: Storage Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.storage == 'true' }}
    uses: ./.github/workflows/integ_test_storage.yml
    secrets: inherit

  logging-test:
    name: Logging Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.logging == 'true' }}
    uses: ./.github/workflows/integ_test_logging.yml
    secrets: inherit

  cloudwatch-test:
    name: CloudWatch Integration Tests
    needs: detect
    if: ${{ needs.detect.outputs.cloudwatch == 'true' }}
    uses: ./.github/workflows/integ_test_cloudwatch.yml
    secrets: inherit

  integ-pass-confirmation:
    name: Confirm Passing Integration Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - detect
      - analytics-test
      - kinesis-firehose-test
      - push-notifications-test
      - predictions-test
      - auth-test
      - auth-client-test
      - geo-test
      - storage-test
      - logging-test
      - cloudwatch-test
    env:
      EXIT_CODE: ${{ contains(needs.*.result, 'failure') && 1 || 0 }}
    steps:
      - run: exit $EXIT_CODE
