name: Integration Tests | API - Functional
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  api-functional-tests:
    name: API Integration Tests | Functional
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSAPIPluginFunctionalTests", "tvOS": "AWSAPIPluginFunctionalTests", "watchOS": "AWSAPIPluginFunctionalTestsWatch"}'
      project_path: ./AmplifyPlugins/API/Tests/APIHostApp
      resource_subfolder: api
    secrets: inherit
