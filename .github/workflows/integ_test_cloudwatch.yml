name: Integration Tests | CloudWatch
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  cloudwatch-integration-tests:
    name: CloudWatch Integration Tests
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
        exclude:
          - platform: ${{ github.event.inputs.ios == 'false' && 'iOS' || 'None' }}
          - platform: ${{ github.event.inputs.tvos == 'false' && 'tvOS' || 'None' }}
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      scheme: CloudWatchLoggingClientIntegrationTests
      platform: ${{ matrix.platform }}
      project_path: ./AmplifyClients/AmplifyCloudWatchClient/Tests/IntegrationTests/CloudWatchLoggingClientHostApp
      resource_subfolder: cloudwatch
      timeout-minutes: 60
    secrets: inherit
