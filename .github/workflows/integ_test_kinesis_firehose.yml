name: Integration Tests | Kinesis & Firehose
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  kinesis-firehose-integration-tests:
    name: Kinesis & Firehose Integration Tests
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AmplifyKinesisClientIntegrationTests", "tvOS": "AmplifyKinesisClientIntegrationTests"}'
      project_path: ./AmplifyClients/Tests/IntegrationTests/KinesisFirehoseClientHostApp
      resource_subfolder: kinesis
    secrets: inherit
