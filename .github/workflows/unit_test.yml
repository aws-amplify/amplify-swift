name: Unit Tests | All
on:
  workflow_call:
    inputs:
      identifier:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      macos:
        description: '💻 macOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
      visionos:
        description: 'ᯅ visionOS'
        required: true
        default: true
        type: boolean 
      
  push:
    branches-ignore:
      - main
      - release

permissions:
    contents: read

concurrency:
  group: ${{ inputs.identifier || github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main'}}

jobs:
  detect:
    name: Detect affected targets
    # Runs on ubuntu (abundant pool) rather than macOS (the scarce, shared Actions
    # pool this whole gating effort exists to conserve). The job only needs git, jq,
    # python3, and `swift package dump-package`; the official swift image supplies
    # Swift on Linux with no third-party action, and the manifest has no host-OS
    # conditionals so the dumped dependency graph is identical to macOS.
    runs-on: ubuntu-latest
    container: swift:6.0
    outputs:
      selected: ${{ steps.sel.outputs.selected }}
      covfiles: ${{ steps.sel.outputs.covfiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install jq and python3
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq python3
          # The checkout dir is owned by a different UID than the container's root user, so git in
          # the detect script below aborts with "detected dubious ownership" unless we allow it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: sel
        shell: bash
        env:
          IDENTIFIER: ${{ inputs.identifier }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Gate only on a genuine feature-branch push. Deploy pipelines invoke this workflow via
          # workflow_call (which passes `identifier`), and manual runs use workflow_dispatch — both
          # must exercise the full matrix, so only an unqualified `push` event is change-gated.
          if [ -n "$IDENTIFIER" ] || [ "$EVENT_NAME" != "push" ]; then
            sel=$(jq -c 'keys' scripts/python/unit_test_groups.json)
          else
            base="$BASE_REF"
            git fetch --no-tags origin "$base" || true
            git diff --name-only "$(git merge-base HEAD "origin/$base")" HEAD > /tmp/changed.txt
            swift package dump-package > /tmp/package.json
            sel=$(python3 scripts/python/affected_targets.py \
              --package /tmp/package.json --changed /tmp/changed.txt \
              --groups scripts/python/unit_test_groups.json | grep '^selected=' | cut -d= -f2-)
          fi
          echo "selected: $sel"
          # Coverage matrix: the selected schemes that carry codecov flags (excludes the
          # no-coverage InternalAWSPinpointUnitTests, which has no `flags`).
          covfiles=$(jq -c --argjson sel "$sel" \
            '[to_entries[] | select(.value.flags != null and (.key as $k | $sel | index($k))) | {scheme: .key, flags: .value.flags}]' \
            scripts/python/unit_test_groups.json)
          {
            echo "selected=$sel"
            echo "covfiles=$covfiles"
          } >> "$GITHUB_OUTPUT"

  # One runner per platform, each running every affected scheme (built once via build-for-testing).
  # This caps peak macOS jobs at the platform count regardless of how many schemes changed.
  unit-tests:
    name: ${{ matrix.platform }} Unit Tests
    needs: detect
    if: ${{ needs.detect.outputs.selected != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS, tvOS, watchOS, visionOS]
        exclude:
          - platform: ${{ github.event.inputs.ios == 'false' && 'iOS' || 'None' }}
          - platform: ${{ github.event.inputs.macos == 'false' && 'macOS' || 'None' }}
          - platform: ${{ github.event.inputs.tvos == 'false' && 'tvOS' || 'None' }}
          - platform: ${{ github.event.inputs.watchos == 'false' && 'watchOS' || 'None' }}
          - platform: ${{ github.event.inputs.visionos == 'false' && 'visionOS' || 'None' }}
    uses: ./.github/workflows/run_platform_all_schemes.yml
    with:
      platform: ${{ matrix.platform }}
      schemes: ${{ needs.detect.outputs.selected }}
      # Coverage is exported on iOS only (as before): one platform's numbers, uploaded per scheme.
      generate_coverage_report: ${{ matrix.platform == 'iOS' && vars.DISABLE_COVERAGE_REPORT != 'true' }}

  report-coverage:
    needs: [detect, unit-tests]
    if: ${{ vars.DISABLE_COVERAGE_REPORT != 'true' && needs.detect.outputs.covfiles != '[]' }}
    name: ${{ matrix.file.scheme }} Unit Tests
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.detect.outputs.covfiles) }}
    uses: ./.github/workflows/upload_coverage_report.yml
    with:
      scheme: ${{ matrix.file.scheme }}
      flags: ${{ matrix.file.flags }}
    secrets: inherit

  unit-test-pass-confirmation:
    runs-on: ubuntu-latest
    name: Confirm Passing Unit Tests
    if: ${{ !cancelled() }}
    needs: [ detect, unit-tests ]
    env:
      EXIT_CODE: ${{ contains(needs.*.result, 'failure') && 1 || 0 }}
    steps:
      - run: exit $EXIT_CODE
