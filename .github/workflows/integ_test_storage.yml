name: Integration Tests | Storage
on:
  workflow_dispatch:
    inputs:
      ios:
        description: '📱 iOS'
        required: true
        default: true
        type: boolean
      tvos:
        description: '📺 tvOS'
        required: true
        default: true
        type: boolean
      watchos:
        description: '⌚️ watchOS'
        required: true
        default: true
        type: boolean
  workflow_call:

permissions:
    id-token: write
    contents: read

jobs:
  storage-integration-tests:
    name: Storage Integration Tests
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      schemes: '{"iOS": "AWSS3StoragePluginIntegrationTests", "tvOS": "AWSS3StoragePluginIntegrationTests", "watchOS": "AWSS3StoragePluginIntegrationTestsWatch"}'
      project_path: ./AmplifyPlugins/Storage/Tests/StorageHostApp/
      resource_subfolder: storage
    secrets: inherit
