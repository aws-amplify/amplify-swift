name: 'Run unit tests for one platform'
description: >
  Runs the given scheme's unit tests on a single platform (build parameters, simulator install,
  test + retry, and optional coverage export). Extracted so the caller can invoke it once per
  platform as sequential steps in a single job — i.e. run every platform on one runner in series,
  instead of fanning out one runner per platform. Dependency/build caching is owned by the caller
  (restored once per job, shared across platforms), so it is intentionally not done here.

inputs:
  scheme:
    description: 'The scheme to run the tests'
    required: true
  platform:
    description: 'The platform in which to run these tests'
    required: true
  xcode_version:
    description: 'The version of Xcode used to run these tests'
    default: 'latest'
  generate_coverage_report:
    description: 'Whether to generate and export code coverage (only meaningful on one platform)'
    default: 'false'
  test_iterations_flags:
    description: 'The xcodebuild flags used when running the test'
    default: '-test-iterations 3 -retry-tests-on-failure -parallel-testing-enabled NO -test-repetition-relaunch-enabled YES'
  retry_tests:
    description: 'Whether to retry the whole test run once on failure'
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Get build parameters for ${{ inputs.platform }}
      id: platform
      uses: ./.github/composite_actions/get_platform_parameters
      with:
        platform: ${{ inputs.platform }}
        xcode_version: ${{ inputs.xcode_version }}

    - name: Install simulators if needed
      uses: ./.github/composite_actions/install_simulators_if_needed
      with:
        xcode_version: ${{ steps.platform.outputs.xcode-version }}
        platform: ${{ inputs.platform }}

    - name: Run ${{ inputs.platform }} Unit Tests
      id: run-tests
      continue-on-error: ${{ inputs.retry_tests == 'true' }}
      uses: ./.github/composite_actions/run_xcodebuild_test
      with:
        scheme: ${{ inputs.scheme }}
        destination: ${{ steps.platform.outputs.destination }}
        sdk: ${{ steps.platform.outputs.sdk }}
        xcode_path: /Applications/Xcode_${{ steps.platform.outputs.xcode-version }}.app
        generate_coverage: ${{ inputs.generate_coverage_report }}
        cloned_source_packages_path: ~/Library/Developer/Xcode/DerivedData/Amplify
        derived_data_path: ${{ github.workspace }}/Build
        other_flags: ${{ inputs.test_iterations_flags }}

    - name: Retry ${{ inputs.platform }} Unit Tests
      if: ${{ steps.run-tests.outcome == 'failure' && inputs.retry_tests == 'true' }}
      uses: ./.github/composite_actions/run_xcodebuild_test
      with:
        scheme: ${{ inputs.scheme }}
        destination: ${{ steps.platform.outputs.destination }}
        sdk: ${{ steps.platform.outputs.sdk }}
        xcode_path: /Applications/Xcode_${{ steps.platform.outputs.xcode-version }}.app
        generate_coverage: ${{ inputs.generate_coverage_report }}
        cloned_source_packages_path: ~/Library/Developer/Xcode/DerivedData/Amplify
        derived_data_path: ${{ github.workspace }}/Build
        other_flags: ${{ inputs.test_iterations_flags }}

    - name: Store Coverage Report File
      if: ${{ inputs.generate_coverage_report == 'true' }}
      uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
      with:
        name: ${{ inputs.scheme }}-Coverage-${{ github.sha }}
        path: ${{ github.workspace }}/${{ inputs.scheme }}-Coverage.lcov
        if-no-files-found: error
        retention-days: 1
