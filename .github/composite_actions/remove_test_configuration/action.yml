name: 'Remove the test configuration from a build'
description: 'Deletes the integration-test configuration that the host apps copy into their test bundles, so a cache of the build holds none of it'

# The host apps' copy phases put the downloaded test configuration into their bundles: most of the plugin's apps copy
# the whole testconfiguration/ directory, the Cognito client's apps copy the files by name into the bundle's
# resources, and the Predictions and Storage apps copy theirs into the source root as amplifyconfiguration.json
# (and amplify_outputs.json), which Copy Bundle Resources puts into the bundles.
# Those files hold CI backends' outputs, test users' credentials and API keys, and a cache entry saved from a
# push to main can be restored by any pull request run. Run this before saving the build directory to a cache.
# A build restored from that cache copies the files again: the copy phases run on every build.

inputs:
  build_path:
    description: 'The build (DerivedData) directory to clean'
    required: true

runs:
  using: "composite"
  steps:
    - name: Remove the test configuration from ${{ inputs.build_path }}
      shell: bash
      env:
        BUILD_PATH: ${{ inputs.build_path }}
      # remove_test_configuration.sh has the names it deletes; test_remove_test_configuration.sh tests it.
      run: bash "$GITHUB_ACTION_PATH/remove_test_configuration.sh" "$BUILD_PATH"
