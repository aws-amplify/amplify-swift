name: 'Run xcodebuild test'
description: 'Action runs the test for the scheme specified'

inputs:
  scheme:
    required: true
    type: string
  project_path:
    required: false
    type: string
  xcode_path:
    required: false
    type: string
  destination:
    required: true
    type: string
  sdk:
    required: false
    type: string
    default: 'iphonesimulator'
  other_flags:
    required: false
    type: string
    default: ''
  generate_coverage:
    required: false
    type: boolean
    default: false
  cloned_source_packages_path:
    required: false
    type: string
    default: ''
  derived_data_path:
    required: false
    type: string
    default: ''
  disable_package_resolution:
    required: false
    type: boolean
    default: false
  test_without_building:
    required: false
    type: boolean
    default: false
  uninstall_bundle_ids:
    description: 'Space-separated bundle IDs to uninstall from the destination simulator before testing. Empty skips the step.'
    required: false
    type: string
    default: ''
  boot_simulator:
    description: 'Boot the destination simulator once the dependencies resolve, and wait for it to finish booting before building and testing. Does nothing for a destination that names no simulator.'
    required: false
    type: boolean
    default: false
  result_bundle_path:
    description: 'Where xcodebuild writes the result bundle (-resultBundlePath), for a later step to read; one there already is removed first. Empty leaves it in DerivedData, as before.'
    required: false
    type: string
    default: ''

runs:
  using: "composite"
  steps:
    # Callers set this for a retry on the simulator the first attempt used. When the app is still
    # installed, xcodebuild can launch the previous install while it installs the new one; the old
    # bundle is then moved aside and deleted mid-run, and later tests fail reading their resources.
    - name: Uninstall apps from the simulator for ${{ inputs.scheme }}
      if: ${{ inputs.uninstall_bundle_ids != '' }}
      shell: bash
      env:
        DESTINATION: ${{ inputs.destination }}
        BUNDLE_IDS: ${{ inputs.uninstall_bundle_ids }}
        XCODE_PATH: ${{ inputs.xcode_path }}
      run: |
        if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi

        # The destination names the simulator by id, or by name and OS.
        udid=$(bash "$GITHUB_ACTION_PATH/simulator_udid.sh" "$DESTINATION")
        if [ -z "$udid" ]; then
          echo "::warning::No simulator found for '$DESTINATION'; nothing uninstalled."
          exit 0
        fi

        xcrun simctl boot "$udid" 2>/dev/null || true
        xcrun simctl bootstatus "$udid" -b || echo "::warning::Simulator $udid did not finish booting"
        for bundle_id in $BUNDLE_IDS; do
          if xcrun simctl uninstall "$udid" "$bundle_id"; then
            echo "Uninstalled $bundle_id from $udid"
          else
            echo "::warning::Could not uninstall $bundle_id from $udid"
          fi
        done

    # Resolve dependencies as an explicit, separately bounded step.
    #
    # Left to xcodebuild, resolution happens silently inside the test invocation.
    # SwiftPM checks out ~31 repositories one at a time through blocking git
    # subprocesses and prints nothing until the first compile, so a slow clone is
    # indistinguishable from a hang: the job produces no output and is eventually
    # killed at the job timeout, taking the test run with it. Observed failures had
    # zero build output and orphaned git / git-remote-http processes.
    #
    # Doing it here means resolution has its own clock and its own log group, is
    # retried for transient git/TLS failures, and — if it genuinely cannot finish —
    # fails fast with a clear reason instead of consuming the whole job budget.
    #
    # The bound uses a background watchdog rather than `timeout-minutes:`, which
    # GitHub rejects on steps inside a composite action, and rather than
    # `timeout(1)`, which is not installed on macOS runners.
    - name: Resolve package dependencies for ${{ inputs.scheme }}
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project_path }}
        XCODE_PATH: ${{ inputs.xcode_path }}
        CLONED_SOURCE_PACKAGES_PATH: ${{ inputs.cloned_source_packages_path }}
        # A cold resolve is ~2 minutes locally but far slower on a loaded runner,
        # where many jobs clone the same graph at once. 25 minutes per attempt is
        # sized to absorb that while still being well short of the job timeout, so
        # a genuine stall surfaces as a fast, explicit failure.
        RESOLVE_TIMEOUT_SECONDS: '1500'
      run: |
        set -o pipefail
        if [ -n "$PROJECT_PATH" ]; then cd "$PROJECT_PATH"; fi
        if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi

        # Callers pass a path under '~/'. xcodebuild expands that '~', but quoted here it stays a literal
        # directory name, so the cleanup between attempts removed nothing: a retry resumed on what the
        # failed attempt left ("Updating from" 30 of the 31 repositories). Expanded once, for both.
        clonedDir="$CLONED_SOURCE_PACKAGES_PATH"
        case "$clonedDir" in \~ | \~/*) clonedDir="$HOME${clonedDir:1}" ;; esac

        clonedPath=()
        if [ -n "$clonedDir" ]; then
          clonedPath=(-clonedSourcePackagesDirPath "$clonedDir")
        fi

        resolve_bounded() {
          xcodebuild -resolvePackageDependencies \
            -scheme '${{ inputs.scheme }}' \
            "${clonedPath[@]}" &
          local pid=$!
          ( sleep "$RESOLVE_TIMEOUT_SECONDS"; kill -9 "$pid" 2>/dev/null ) &
          local watchdog=$!
          wait "$pid"
          local status=$?
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          return $status
        }

        for attempt in 1 2 3; do
          echo "::group::Resolving package dependencies (attempt $attempt of 3)"
          start=$(date +%s)
          if resolve_bounded; then
            echo "::endgroup::"
            echo "Dependencies resolved in $(( $(date +%s) - start ))s on attempt $attempt."
            exit 0
          fi
          echo "::endgroup::"
          echo "Attempt $attempt failed or exceeded ${RESOLVE_TIMEOUT_SECONDS}s after $(( $(date +%s) - start ))s."

          # Clear partial mirror state so the next attempt is not resuming a
          # half-written clone, which is a common way for this to wedge.
          if [ -n "$clonedDir" ]; then
            rm -rf "${clonedDir%/}/repositories" || true
          fi
        done

        echo "::error::Could not resolve package dependencies after 3 attempts. \
        This is a dependency fetch problem, not a test failure."
        exit 1

    # Left to xcodebuild, the simulator boots only once the build is done, right before the tests, and on a
    # runner image its first boot is long: the UI tests then start on a simulator still finishing it, and the
    # first app launch times out ("Timed out while launching application via Xcode", the hosted UI and push
    # jobs of run 37338053976) or the WebAuthn tests' simulator server is too slow to answer. Booted here, after
    # the dependencies resolve and before the build (the build and the tests are one xcodebuild invocation, and
    # the next step waits for the boot to finish), the build and the tests start on a booted simulator.
    #
    # Not before the resolution: booted while the dependencies resolve, the boot competes with them for the
    # runner. On runs 37431589664 and 37495827804 xcodebuild then took 71-80 s (median) to start resolving
    # instead of 4-5 s, and a cold resolution took 611-706 s (median) on the integration jobs, which boot,
    # against 388-397 s on the unit jobs of the same pushes and 341-380 s on main's integration jobs, which
    # do not.
    - name: Boot the simulator for ${{ inputs.scheme }}
      id: boot-simulator
      if: ${{ inputs.boot_simulator == 'true' }}
      shell: bash
      env:
        DESTINATION: ${{ inputs.destination }}
        XCODE_PATH: ${{ inputs.xcode_path }}
      run: |
        if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi
        udid=$(bash "$GITHUB_ACTION_PATH/simulator_udid.sh" "$DESTINATION")
        if [ -z "$udid" ]; then
          echo "No simulator to boot for '$DESTINATION'."
          exit 0
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        # Starts the boot and returns; an already booted simulator is left as it is.
        if xcrun simctl boot "$udid" 2>/dev/null; then
          echo "Booting the simulator for '$DESTINATION'."
        else
          echo "The simulator for '$DESTINATION' is already booted, or could not boot (xcodebuild then boots it)."
        fi

    # Bounded with a watchdog, as the resolution is: a boot that never completes leaves the simulator to
    # xcodebuild, as before, after a warning.
    - name: Wait for the simulator to finish booting for ${{ inputs.scheme }}
      if: ${{ inputs.boot_simulator == 'true' && steps.boot-simulator.outputs.udid != '' }}
      shell: bash
      env:
        UDID: ${{ steps.boot-simulator.outputs.udid }}
        BOOT_TIMEOUT_SECONDS: '600'
      run: |
        start=$(date +%s)
        xcrun simctl bootstatus "$UDID" -b > /dev/null &
        pid=$!
        ( sleep "$BOOT_TIMEOUT_SECONDS"; kill -9 "$pid" 2>/dev/null ) > /dev/null 2>&1 &
        watchdog=$!
        status=0
        wait "$pid" || status=$?
        kill "$watchdog" 2>/dev/null || true
        wait "$watchdog" 2>/dev/null || true
        if [ "$status" -eq 0 ]; then
          echo "The simulator finished booting $(( $(date +%s) - start )) s after this step started."
        else
          echo "::warning::The simulator did not finish booting within ${BOOT_TIMEOUT_SECONDS} s (status $status); xcodebuild takes it from here."
        fi

    - name: Test ${{ inputs.scheme }}
      env:
        SCHEME: ${{ inputs.scheme }}
        PROJECT_PATH: ${{ inputs.project_path }}
        XCODE_PATH: ${{ inputs.xcode_path }}
        CLONED_SOURCE_PACKAGES_PATH: ${{ inputs.cloned_source_packages_path }}
        DERIVED_DATA_PATH: ${{ inputs.derived_data_path }}
        RESULT_BUNDLE_PATH: ${{ inputs.result_bundle_path }}
      run: |
        if [ ! -z "$PROJECT_PATH" ]; then
          cd $PROJECT_PATH
        fi
        if [ ! -z "$XCODE_PATH" ]; then
          echo "Using Xcode $XCODE_PATH"
          sudo xcode-select -s $XCODE_PATH
        fi

        clonedSourcePackagesPath=""
        if [ ! -z "$CLONED_SOURCE_PACKAGES_PATH" ]; then
          echo "Using custom cloned source packages path"
          clonedSourcePackagesPath+="-clonedSourcePackagesDirPath $CLONED_SOURCE_PACKAGES_PATH"
        fi

        derivedDataPath=""
        if [ ! -z "$DERIVED_DATA_PATH" ]; then
          echo "Using custom DerivedData path"
          derivedDataPath+="-derivedDataPath $DERIVED_DATA_PATH"
        fi

        coverageFlags=""
        if [ "${{ inputs.generate_coverage }}" == "true" ]; then
          echo "Code Coverage is enabled!"
          coverageFlags+="-enableCodeCoverage YES"
          if [ -z "$clonedSourcePackagesPath" ]; then
            clonedSourcePackagesPath+="-clonedSourcePackagesDirPath ~/Library/Developer/Xcode/DerivedData/Amplify"
          fi

          if [ -z "$derivedDataPath" ]; then
            derivedDataPath+="-derivedDataPath Build/"
          fi
        fi

        # Unconditionally disabled. The resolve step above already produced the
        # checkouts (or failed loudly trying), so xcodebuild must never fall back
        # to resolving here — that fallback is the silent hang this avoids.
        echo "Disabling Automatic Package Resolution"
        clonedSourcePackagesPath+=" -disableAutomaticPackageResolution"

        # xcodebuild refuses a result bundle path that exists.
        resultBundlePath=""
        if [ -n "$RESULT_BUNDLE_PATH" ]; then
          rm -rf "$RESULT_BUNDLE_PATH"
          resultBundlePath="-resultBundlePath $RESULT_BUNDLE_PATH"
        fi

        action="test"
        if [ "${{ inputs.test_without_building }}" == "true" ]; then
          echo "Testing without building..."
          action+="-without-building"
        fi

        xcode-select -p
        xcodebuild -version
        xcodebuild $action -scheme $SCHEME -destination '${{ inputs.destination }}' -skipPackagePluginValidation ${{ inputs.other_flags }} $clonedSourcePackagesPath $derivedDataPath $coverageFlags $resultBundlePath | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
      shell: bash

    - name: Generate Coverage report
      if: ${{ inputs.generate_coverage == 'true' }}
      env:
        SCHEME: ${{ inputs.scheme }}
        DERIVED_DATA_PATH: ${{ inputs.derived_data_path }}
      run: |
        echo "Generating Coverage report..."

        derivedDataPath=""
        if [ ! -z "$DERIVED_DATA_PATH" ]; then
          derivedDataPath="$DERIVED_DATA_PATH"
        else
          derivedDataPath="Build"
        fi

        cd $derivedDataPath/Build/ProfileData
        cd $(ls -d */|head -n 1)
        pathCoverage=Build/Build/ProfileData/${PWD##*/}/Coverage.profdata
        cd ${{ github.workspace }}
        xcrun llvm-cov export -format="lcov" -instr-profile $pathCoverage $derivedDataPath/Build/Products/Debug-${{ inputs.sdk }}/$SCHEME.o > $SCHEME-Coverage.lcov
      shell: bash
